<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입장권 바코드 | 콕패스</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
  :root{
    --teal:#0E9E8F; --tealDeep:#0B7E72; --ink:#12332F; --coral:#FF8A5B;
    --cream:#F6FBFA; --gray:#5E7570; --graylight:#8FA19E; --line:#E1EEEB;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px}
  .card{background:#fff;border-radius:18px;box-shadow:0 8px 32px rgba(18,51,47,.09);max-width:420px;width:100%;overflow:hidden}
  .card-head{background:linear-gradient(135deg,var(--tealDeep),var(--teal));padding:22px 24px;color:#fff}
  .card-head .brand{font-family:'Black Han Sans',sans-serif;font-size:12px;letter-spacing:.08em;opacity:.85;margin-bottom:6px}
  .card-head .venue{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .card-head .ticket{font-size:13px;opacity:.9;margin-top:2px}
  .card-body{padding:26px 24px 24px}
  .row{display:flex;justify-content:space-between;font-size:13px;color:var(--gray);padding:7px 0;border-bottom:1px solid var(--line)}
  .row:last-of-type{border-bottom:none;margin-bottom:18px}
  .row span:last-child{color:var(--ink);font-weight:600}
  .barcode-wrap{background:#fafdfc;border:1px solid var(--line);border-radius:12px;padding:18px 10px;text-align:center;overflow-x:auto}
  .barcode-wrap svg{max-width:100%}
  .pin-fallback{font-size:20px;font-weight:800;letter-spacing:.08em;color:var(--ink);padding:20px 0}
  .notice{margin-top:16px;background:#EAF6F4;border:1px solid #CDE9E5;border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--tealDeep);line-height:1.6}
  .state{padding:60px 24px;text-align:center;color:var(--gray);font-size:14px;line-height:1.8}
  .state strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
  .foot{margin-top:24px;text-align:center;font-size:11.5px;color:var(--gray);line-height:1.8}
  .foot a{color:var(--tealDeep);text-decoration:none}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="state" id="state">불러오는 중입니다...</div>
</div>

<div class="foot">
  콕패스(뷰홀릭) · 사업자등록번호 812-14-01466<br>
  문의 <a href="tel:010-9747-8999">010-9747-8999</a> · <a href="index.html">홈페이지 바로가기</a>
</div>

<script>
const SB_URL = 'https://okdahyvqhbqvfpvtpcip.supabase.co';
const SB_KEY = 'sb_publishable_or8TBFpfxdJFC4MbC3PLrg_adM9L9h3';

function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadTicket() {
  const params = new URLSearchParams(location.search);
  const pin = (params.get('pin') || '').trim();
  const card = document.getElementById('card');

  if (!pin) {
    card.innerHTML = `<div class="state"><strong>바코드 정보를 찾을 수 없습니다</strong>링크가 올바른지 확인해주세요.<br>문제가 계속되면 010-9747-8999로 문의해주세요.</div>`;
    return;
  }

  try {
    // pin_inventory는 anon 키로 직접 조회할 수 없도록 막혀있습니다(입장권 바코드 전체공개 방지).
    // 대신 정확히 이 핀번호 1건만 조회해주는 공개 Edge Function(pin-lookup)을 거칩니다.
    const res = await fetch(`${SB_URL}/functions/v1/pin-lookup`, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin }),
    });
    const data = await res.json();
    const p = data && data.ticket ? data.ticket : null;

    if (!p) {
      card.innerHTML = `<div class="state"><strong>바코드 정보를 찾을 수 없습니다</strong>링크가 올바른지 확인해주세요.<br>문제가 계속되면 010-9747-8999로 문의해주세요.</div>`;
      return;
    }

    // 취소/환불되었거나 이미 사용된 입장권은 바코드를 아예 노출하지 않는다 (재입장 악용 방지)
    if (p.status === 'refunded') {
      card.innerHTML = `<div class="state"><strong>취소된 입장권입니다</strong>이 예약(입장권)은 취소 또는 환불 처리되어 더 이상 사용하실 수 없습니다.<br>문의사항은 010-9747-8999로 연락해주세요.</div>`;
      return;
    }
    if (p.status === 'used') {
      card.innerHTML = `<div class="state"><strong>이미 사용된 입장권입니다</strong>현장에서 이미 사용 처리된 입장권입니다.<br>문의사항은 010-9747-8999로 연락해주세요.</div>`;
      return;
    }

    card.innerHTML = `
      <div class="card-head">
        <div class="brand">콕패스 입장권</div>
        <div class="venue">${esc(p.venue_name)}</div>
        <div class="ticket">${esc(p.ticket_name)}</div>
      </div>
      <div class="card-body">
        ${p.buyer_name ? `<div class="row"><span>예약자</span><span>${esc(p.buyer_name)}</span></div>` : ''}
        <div class="row"><span>유효기간</span><span>${fmtDate(p.valid_from)} ~ ${fmtDate(p.valid_to)}</span></div>
        <div class="barcode-wrap">
          <svg id="barcode-svg"></svg>
        </div>
        <div class="notice">현장 입장 시 이 화면의 바코드를 제시해주세요. 화면 캡처본도 사용 가능합니다.</div>
      </div>`;

    try {
      JsBarcode('#barcode-svg', p.pin_number, { format:'CODE128', width:2.4, height:90, displayValue:true, fontSize:16, margin:8 });
    } catch(e) {
      document.querySelector('.barcode-wrap').innerHTML = `<div class="pin-fallback">${esc(p.pin_number)}</div>`;
    }
  } catch (e) {
    card.innerHTML = `<div class="state"><strong>불러오지 못했습니다</strong>잠시 후 다시 시도해주세요.<br>010-9747-8999로 문의해주세요.</div>`;
  }
}

loadTicket();
</script>
</body>
</html>
